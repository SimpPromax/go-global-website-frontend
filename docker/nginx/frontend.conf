server {
    listen 80;
    server_name _;

    # Send logs to stdout/stderr for docker logs
    access_log /dev/stdout;
    error_log /dev/stderr;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent nginx from exposing unnecessary files
    location ~ /\. {
        deny all;
    }
}